<!DOCTYPE html>
<html>
<head><title>Icon Creator</title></head>
<body>
<h2>Icon Generator</h2>
<p>Click buttons to download icons:</p>
<button onclick="downloadIcon(192)">Download 192x192</button>
<button onclick="downloadIcon(512)">Download 512x512</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
function downloadIcon(size) {
    const canvas = document.getElementById('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    // Create gradient background
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#2d5f3f');
    gradient.addColorStop(1, '#1a472a');
    ctx.fillStyle = gradient;
    
    // Draw rounded rectangle
    const radius = size * 0.15;
    ctx.beginPath();
    ctx.moveTo(radius, 0);
    ctx.lineTo(size - radius, 0);
    ctx.quadraticCurveTo(size, 0, size, radius);
    ctx.lineTo(size, size - radius);
    ctx.quadraticCurveTo(size, size, size - radius, size);
    ctx.lineTo(radius, size);
    ctx.quadraticCurveTo(0, size, 0, size - radius);
    ctx.lineTo(0, radius);
    ctx.quadraticCurveTo(0, 0, radius, 0);
    ctx.closePath();
    ctx.fill();
    
    // Draw location pin
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.beginPath();
    ctx.arc(size/2, size*0.43, size*0.16, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner dot
    ctx.fillStyle = '#1a472a';
    ctx.beginPath();
    ctx.arc(size/2, size*0.43, size*0.07, 0, Math.PI * 2);
    ctx.fill();
    
    // GPS rays
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = size * 0.015;
    ctx.lineCap = 'round';
    
    // Top ray
    ctx.beginPath();
    ctx.moveTo(size/2, size*0.1);
    ctx.lineTo(size/2, size*0.2);
    ctx.stroke();
    
    // Bottom ray
    ctx.beginPath();
    ctx.moveTo(size/2, size*0.9);
    ctx.lineTo(size/2, size*0.8);
    ctx.stroke();
    
    // Left ray
    ctx.beginPath();
    ctx.moveTo(size*0.1, size/2);
    ctx.lineTo(size*0.2, size/2);
    ctx.stroke();
    
    // Right ray
    ctx.beginPath();
    ctx.moveTo(size*0.9, size/2);
    ctx.lineTo(size*0.8, size/2);
    ctx.stroke();
    
    // Download
    canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-' + size + '.png';
        a.click();
        URL.revokeObjectURL(url);
    });
}
</script>
</body>
</html>
