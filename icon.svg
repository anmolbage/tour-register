<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5f3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a472a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Location pin -->
  <circle cx="256" cy="220" r="80" fill="white" opacity="0.95"/>
  <circle cx="256" cy="220" r="35" fill="#1a472a"/>
  
  <!-- GPS rays -->
  <line x1="256" y1="100" x2="256" y2="50" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
  <line x1="256" y1="462" x2="256" y2="412" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
  <line x1="100" y1="256" x2="50" y2="256" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
  <line x1="462" y1="256" x2="412" y2="256" stroke="white" stroke-width="8" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Decorative route path -->
  <path d="M 256 300 Q 180 340 200 400 Q 220 450 256 480" 
        stroke="white" stroke-width="6" fill="none" opacity="0.4" 
        stroke-dasharray="10,15" stroke-linecap="round"/>
</svg>
